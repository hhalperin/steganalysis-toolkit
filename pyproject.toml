[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "steganalysis-toolkit"
version = "0.1.0"
description = "Research toolkit for steganalysis and watermark-resilience experiments (text + images)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "Steganalysis Toolkit contributors" }]
dependencies = [
    "Pillow>=10.0.0",
    "pypng>=0.20220715.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pycryptodome>=3.19.0",
    "zstandard>=0.21.0",
    "exifread>=3.0.0",
    "pillow-heif>=0.13.0",
    "matplotlib>=3.7.0",
    "rich>=13.0.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "pytesseract>=0.3.10",
]

[project.scripts]
stk = "stega.cli:main"

[tool.setuptools.packages.find]
include = ["stega*"]

[tool.setuptools.package-data]
stega = ["tools/prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 88
target-version = ["py38"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false
